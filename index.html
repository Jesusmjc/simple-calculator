<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EZ Calculator</title>
    <link rel="icon" type="image/png" href="assets/calculator.png">
    
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.js"></script>
</head>
<body>
    <div id="calculator" class="calculator">
        <div id="history-panel" class="history-panel hidden"></div>
        <div id="keypad" class="div-keypad">
                <input type="text" id="screen" class="screen" value="0" readonly>

                <button id="btnAC" class="btn" data-type="ac">AC</button>
                <button id="btnBack" class="btn" data-type="back">&lt;---</button>
                <button id="btnPercent" class="btn" data-type="char" data-value="%">%</button>
                <button id="btnDivision" class="btn" data-type="char" data-value="/">/</button>

                <button class="btn-number" data-type="char" data-value="7">7</button>
                <button class="btn-number" data-type="char" data-value="8">8</button>
                <button class="btn-number" data-type="char" data-value="9">9</button>
                <button id="btnMultiplication" class="btn" data-type="char" data-value="*">X</button>

                <button class="btn-number" data-type="char" data-value="4">4</button>
                <button class="btn-number" data-type="char" data-value="5">5</button>
                <button class="btn-number" data-type="char" data-value="6">6</button>
                <button class="btn" data-type="char" data-value="-">-</button>

                <button class="btn-number" data-type="char" data-value="1">1</button>
                <button class="btn-number" data-type="char" data-value="2">2</button>
                <button class="btn-number" data-type="char" data-value="3">3</button>
                <button class="btn" data-type="char" data-value="+">+</button>

                <button class="btn" data-type="history">History</button>
                <button class="btn-number" data-type="char" data-value="0">0</button>
                <button class="btn" data-type="char" data-value=".">.</button>
                <button class="btn" data-type="equals">=</button>
        </div>
    </div>
</body>
